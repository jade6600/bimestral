<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Ingeniería Química</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- ENCABEZADO -->
    <header class="bg-white shadow-sm">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="text-xl font-bold text-gray-900">
                Ingeniería Química
            </a>

            <a href="acceso.html"
               class="text-gray-600 hover:text-gray-900">
                Volver a acceso
            </a>

        </nav>
    </header>


    <!-- CONTENIDO -->
    <main class="min-h-screen flex items-center justify-center px-6 py-12">

        <section class="bg-white w-full max-w-lg p-8 rounded-2xl shadow-md">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-gray-900 mb-3">
                    Crear cuenta
                </h1>

                <p class="text-gray-600">
                    Regístrate para solicitar servicios profesionales.
                </p>

            </div>


            <!-- FORMULARIO -->
            <form action="#" method="post" class="space-y-5">

                <!-- NOMBRE Y APELLIDO -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label for="nombre"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-gray-500"
                        >
                    </div>


                    <div>
                        <label for="apellido"
                               class="block text-sm font-medium text-gray-700 mb-2">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-gray-500"
                        >
                    </div>

                </div>


                <!-- CORREO -->
                <div>

                    <label for="correo"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required
                        placeholder="ejemplo@correo.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-gray-500"
                    >

                </div>


                <!-- TELÉFONO -->
                <div>

                    <label for="telefono"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Número de contacto"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-gray-500"
                    >

                </div>


                <!-- CONTRASEÑA -->
                <div>

                    <label for="contrasena"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-gray-500"
                    >

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div>

                    <label for="confirmar_contrasena"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar_contrasena"
                        name="confirmar_contrasena"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-gray-500"
                    >

                </div>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="w-full bg-gray-900 text-white py-3 rounded-lg
                           font-semibold hover:bg-gray-700 transition">
                    Crear cuenta
                </button>

            </form>


            <!-- LOGIN -->
            <div class="text-center mt-6">

                <p class="text-gray-600">
                    ¿Ya tienes una cuenta?
                </p>

                <a href="login-cliente.html"
                   class="text-gray-900 font-semibold hover:underline">
                    Iniciar sesión
                </a>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="bg-gray-900 text-white text-center py-6">

        <p>
            © 2032 Ingeniería Química aplicada a la industria cosmética
        </p>

    </footer>

</body>
</html>
